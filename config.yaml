# All model IDs live here; no model name is hard-coded in code (plan §7).
# TODO(P2): replace the placeholders after checking AI Studio / build.nvidia.com by hand.
models:
  lead:        {provider: gemini,        model: gemini-3.8-flash}   # verified via models.list 2026-11-05
  query:       {provider: gemini,        model: gemini-3.8-flash}   # verified via models.list 2026-11-05
  extractor:   {provider: gemini,        model: TODO-verify-gemini-flash-lite}
  normalizer:  {provider: gemini,        model: TODO-verify-gemini-flash}
  conflict:    {provider: gemini,        model: TODO-verify-gemini-flash}
  synthesizer: {provider: gemini,        model: TODO-verify-gemini-flash}
  citation:    {provider: gemini,        model: TODO-verify-gemini-flash}
  critic:      {provider: openai_compat, model: TODO-verify-nim-critic}

limits:                       # §1.3 (values above the max are rejected at load time)
  sub_questions: 3
  retmax_candidates: 100
  papers_per_query: 25
  coverage_extra_rounds: 1
  query_refinement_attempts: 2
  synth_retries: 2
  abstracts_per_extraction: 5

query_band: {min_hits: 20, max_hits: 2000}   # §5.2 target band

conflict: {balance_ratio: 2, lopsided_ratio: 4}   # §5.6

concurrency: {ncbi: 5, llm: 4}

budget:                       # §8.2
  max_llm_calls_per_run: 60
  max_tokens_per_run: null    # null = unlimited until we measure real usage

graph: {recursion_limit: 60}

ncbi:                         # §5.3. Keys come from env vars (names below), never from this file.
  tool: biolitsynth
  email_env: NCBI_EMAIL       # optional but recommended by NCBI
  api_key_env: NCBI_API_KEY   # optional: 10 req/s with a key, 3 req/s without
  esearch_ttl_days: 7         # §6.3
  efetch_batch_size: 200
  max_retries: 3
  timeout_s: 30

providers:                    # §7. Keys come from env vars (names below), never from this file.
  gemini: {api_key_env: GEMINI_API_KEY, rpm: 10, max_retries: 4}   # rpm: free-tier guess; set from AI Studio
  openai_compat:              # NVIDIA NIM (critic, P6). Groq: base_url https://api.groq.com/openai/v1, GROQ_API_KEY
    {api_key_env: NVIDIA_API_KEY, base_url: "https://integrate.api.nvidia.com/v1", rpm: 40, max_retries: 4}

# Pinned prompt versions (§11.5): a new version goes live only after its decision passes. Unlisted = latest.
prompt_versions: {query_builder: 1}

paths: {data_dir: data, runs_dir: runs}
